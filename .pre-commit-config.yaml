# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
# ruff and uv run from the dev environment, not from pinned hook repos: a
# hook `rev` is a second version next to uv.lock that Dependabot never bumps,
# so the hook and CI's `make lint` drifted apart (0.15 here vs 0.17 locked).
# Now uv.lock is the only ruff version, and `required-version` in
# pyproject.toml is the floor for the uv that writes the lockfile.
- repo: local
  hooks:
    - id: ruff
      name: ruff
      entry: uv run ruff check --fix --force-exclude
      language: system
      types_or: [python, pyi]
      exclude: ^(src/tagpack/|src/tagstore/|clients/|tests/regressions/)
    - id: ruff-format
      name: ruff format
      entry: uv run ruff format --force-exclude
      language: system
      types_or: [python, pyi]
      exclude: ^(src/tagpack/|src/tagstore/|clients/|tests/regressions/)
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    # spark/ holds the Scala pipeline; its formatting is owned by
    # scalafmt/scalafix (see spark/Makefile), and rewriting files there would
    # also touch test fixtures the Scala tests compare byte for byte.
    -   id: trailing-whitespace
        exclude: ^(clients|spark)/
    -   id: end-of-file-fixer
        exclude: ^(clients|spark)/
    -
        id: check-yaml
        exclude: tests/testfiles
    -   id: check-added-large-files
        args: ['--maxkb=4096']
        exclude: |
            (?x)^(
                uv.lock|
                spark/src/test/resources/.*
            )$
    -
        id: name-tests-test
        args: [--pytest-test-first]
        exclude: (helpers\.py|tests/web/|tests/regressions/)
    -
        id: debug-statements
        exclude: postmortemdebug.py
    -   id: check-docstring-first
        exclude: ^clients/
- repo: local
  hooks:
    # Update the uv lockfile
    - id: uv-lock
      name: uv-lock
      entry: uv lock
      language: system
      files: ^(uv\.lock|pyproject\.toml|uv\.toml)$
      pass_filenames: false
-   repo: local
    hooks:
    -   id: semver-check
        name: Ensure semantic versions are valid
        entry: make check-semver
        language: system
        pass_filenames: false
        always_run: true
    -   id: update-api-version
        name: Sync API version from Makefile to version.py
        entry: make update-api-version
        language: system
        pass_filenames: false
        always_run: true
    -   id: sync-spark-packages
        name: Sync Scala job packages from spark/build.sbt to config.py
        entry: make sync-spark-packages
        language: system
        pass_filenames: false
        always_run: true
    -   id: type-check
        name: type-check
        entry: make type-check
        language: system
        pass_filenames: false
        always_run: true
    # 7s of Docker + the Java openapi-generator. Its only inputs are
    # graphsenselib.web.app (via scripts/generate_openapi_spec.py), the mustache
    # templates and the compat patches, so it ran on every commit that could not
    # possibly change the spec. CI regenerates unconditionally, so drift still
    # surfaces there if this filter is ever too narrow.
    -   id: codegen
        name: Ensure Generated Code is up to date
        entry: make run-codegen
        language: system
        pass_filenames: false
        files: ^(src/graphsenselib/web/|clients/python/templates/|clients/python/compat/)
    -   id: sync-gs-files
        name: Sync gs_files into the python client
        entry: make -C clients/python sync-gs-files
        language: system
        pass_filenames: false
        files: ^src/graphsenselib/convert/gs_files/|^clients/python/graphsense/gs_files/|^clients/python/scripts/sync_gs_files\.py$
    -   id: sync-address-scan
        name: Sync address_scan into the python client
        entry: make -C clients/python sync-address-scan
        language: system
        pass_filenames: false
        files: ^src/graphsenselib/convert/address_scan/|^clients/python/graphsense/address_scan/|^clients/python/scripts/sync_address_scan\.py$
    -   id: ensure-env
        name: Ensure UV environment is ready
        entry: uv sync --dev --all-packages --all-extras
        language: system
        pass_filenames: false
        always_run: true
    # cargo test is 3.3s cold / 0.06s warm -- cheap enough to gate on commit,
    # and until now the Rust extension was only ever tested in CI.
    -   id: rust-test
        name: cargo test (gs_clustering)
        entry: make test-rust
        language: system
        pass_filenames: false
        files: ^rust/
    # The fast gate: no coverage, no slow marks, no testcontainers (~33s vs
    # ~226s). The container-backed and slow tests are covered by `make test-ci`
    # in .github/workflows/run_tests.yaml, which runs the suite in full.
    -   id: pytest-check
        name: 'pytest: fast subset only (no slow/container tests)'
        entry: make test-fast
        language: system
        pass_filenames: false
        always_run: true
