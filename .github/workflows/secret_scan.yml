# Secret scan over the whole git history, on every push and pull request.
# It also catches what the pre-commit hook could not: a commit made without the
# hooks (--no-verify), or one merged on GitHub. Rules: .gitleaks.toml (the
# defaults minus public chain data), reviewed false positives: .gitleaksignore.
# --redact: the log names file, line and rule only, never a value.
name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the whole history
      - name: Install gitleaks
        # same version as the pre-commit hook (.pre-commit-config.yaml)
        run: |
          v=8.30.0
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v$v/gitleaks_${v}_linux_x64.tar.gz"
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  /tmp/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan the whole history
        run: gitleaks git --redact --no-banner .
