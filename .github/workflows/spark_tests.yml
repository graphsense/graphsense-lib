name: Run Spark Unit-Tests

# The Scala pipeline lives in spark/. It is exercised on every change to that
# tree AND on every change to the delta updater or the transformed schema:
# both produce the same derived tables, so a change to one side without the
# other is the exact drift this job exists to catch.
# (Paths are repeated per trigger: GitHub Actions does not support YAML
# anchors.)
on:
  push:
    branches:
      - master
      - develop
    paths:
      - 'spark/**'
      - 'src/graphsenselib/deltaupdate/**'
      - 'src/graphsenselib/schema/resources/transformed_*.sql'
      - '.github/workflows/spark_tests.yml'
  pull_request:
    paths:
      - 'spark/**'
      - 'src/graphsenselib/deltaupdate/**'
      - 'src/graphsenselib/schema/resources/transformed_*.sql'
      - '.github/workflows/spark_tests.yml'

jobs:
  # Not "build": three other workflows already expose a check by that name, so
  # the Spark run is indistinguishable in a PR's check list.
  spark-test:
    runs-on: ubuntu-latest
    # 11 is what production runs (Cassandra 4.1 is co-located with the Spark
    # workers and supports 8/11 only) and what spark_release.yml builds on. 17
    # is the highest JVM Spark 3.5 supports, and is tested so that "runs on a
    # newer JVM" is an observed fact rather than an assumption — the jar itself
    # is Java 8 bytecode and loads anywhere, but module-system encapsulation
    # and reflection behaviour differ, which is what this catches. Java 21
    # would need Spark 4.0.
    strategy:
      fail-fast: false
      matrix:
        java: [11, 17]
    defaults:
      run:
        working-directory: spark

    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Setup JDK
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: ${{ matrix.java }}
    - name: Setup sbt launcher
      uses: sbt/setup-sbt@v1
    - name: Test with SBT
      run: sbt test
