name: Publish graphsense-spark image

# The Scala pipeline's container image, carried over from the standalone
# graphsense-spark repo. Production runs the jar through spark-submit and does
# not need this, but the image is what makes `make run-docker-<chain>-transform-local`
# and any self-contained deployment work.
#
# Two things differ from the standalone version and both matter:
#  * the image name is hard-coded rather than ${{ github.repository }}, which in
#    this repo resolves to graphsense/graphsense-lib — the LIBRARY image. The
#    Spark image keeps its own package so existing pulls of
#    ghcr.io/graphsense/graphsense-spark keep resolving.
#  * the trigger is the monorepo's spark-v* track, and the prefix is stripped
#    for the image tag so the published tags stay vYY.MM.P as before.

on:
  workflow_dispatch:
  push:
    tags: ['spark-v*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: graphsense/graphsense-spark

jobs:
  publish-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # completes the identity challenge with sigstore/fulcio
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # On a tag push the version comes from the tag; a manual dispatch runs
      # off a branch, where the tag name is meaningless, so fall back to the
      # same RELEASE line build.sbt reads.
      - name: Derive image tag
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#spark-}"
          else
            version=$(sed -n "s/^RELEASE := '\?v\?\([0-9.]*\)'\?/v\1/p" spark/Makefile)
          fi
          if [ -z "$version" ]; then
            echo "Could not determine a version to tag the image with"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing ${IMAGE_NAME}:${version}"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.4.0
        with:
          cosign-release: 'v2.2.2'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Both tags are explicit. metadata-action's default `latest=auto`
          # only adds `latest` when the ref is a git tag, which a manual
          # dispatch (a branch ref) never is — that is how the first monorepo
          # image shipped without one.
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' || github.ref_name == 'master' }}

      # spark/ is the build context: the Dockerfile ADDs src/, docker/,
      # build.sbt and friends by paths relative to that tree.
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: ./spark
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Only writes to the public Rekor transparency log while the package is
      # public, which avoids leaking data for a private one.
      - name: Sign the published Docker image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
