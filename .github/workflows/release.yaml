name: Create release

on:
  workflow_dispatch:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+

permissions:
  contents: write

jobs:
  # A tag push does not trigger run_tests.yaml on its own (that workflow listens
  # on master/develop branch pushes and pull requests), so the suite is invoked
  # here explicitly. Both this and the image publish must succeed before the
  # GitHub release is cut; previously all three ran in parallel off the tag and
  # a release could be published against a failing build.
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/run_tests.yaml

  publish-image:
    needs: test
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/github-packages-publish.yaml

  release:
    name: Release pushed tag
    needs: [test, publish-image]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Filter CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { in_section=1; print; next }
            in_section && $0 ~ "^## \\[" { exit }
            in_section { print }
          ' CHANGELOG.md > CHANGELOG_LATEST.md

          if [ ! -s CHANGELOG_LATEST.md ]; then
            echo "No changelog section found for version $VERSION in CHANGELOG.md"
            exit 1
          fi
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
        run: |
          gh release create "${{  github.ref_name }}" \
              --repo="$GITHUB_REPOSITORY" \
              --title="${GITHUB_REPOSITORY#*/} ${tag#v}" \
              -F CHANGELOG_LATEST.md \
              --generate-notes
