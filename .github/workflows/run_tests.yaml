name: Unit Tests and Build

on:
  push:
    branches:
      - master
      - develop

  pull_request:

  workflow_dispatch:

  # allow other workflows (e.g. image publish) to gate on the test suite
  workflow_call:

permissions:
  contents: read


jobs:
  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run Rust unit tests
        run: make test-rust

  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # One leg is the "primary": it measures coverage and runs the
          # reduced-extras pass. Both check properties of the codebase, not of
          # the interpreter, so doing them on all four legs cost wall-clock
          # (~18% for coverage, plus a second full suite run for the extras
          # pass) without testing anything the primary leg does not already.
          - python: "3.11"
            primary: true

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: fix openssl legacy mode
        run: sudo sed -i '/^default = default_sect/a legacy = legacy_sect' /etc/ssl/openssl.cnf &&  sudo sed -i 's/#openssl_conf/openssl_conf/g' /etc/ssl/openssl.cnf && sudo sed -i '/^\[default_sect\]/a activate = 1\n\[legacy_sect\]\nactivate = 1' /etc/ssl/openssl.cnf
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          # Without this every leg resolves and downloads the whole dependency
          # tree from scratch; the cold leg spent 80s in `uv sync` while warm
          # ones took 3-5s. Keyed on the root lockfile, which is what
          # `uv sync` resolves against.
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install requirements
        run: uv sync --python=${{ matrix.python }}
      - name: Run Unit Tests
        run: make test-ci COVERAGE=${{ matrix.primary && '1' || '0' }}
      - name: Run Unit Tests with base dependencies
        if: matrix.primary
        run: make test-with-base-dependencies-ci
      - name: Run Lint
        run: make lint
      - name: Run type check
        run: make type-check
      - name: Validate MCP curation (drift gate)
        run: make mcp-validate-curation
      - name: Build wheel
        run: make build
