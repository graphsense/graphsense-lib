# Dependabot configuration. See:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Root project. Version updates are grouped: without a group each bump is its
  # own PR, the default open-pull-requests-limit of 5 fills up, and Dependabot
  # then stops opening uv PRs entirely (that is how gitpython/aiohttp sat on
  # 5 open version PRs while security alerts piled up). One weekly PR for
  # minor+patch keeps the slot free; majors still come individually.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      uv-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # The generated API client is a separate uv project with its own lockfile;
  # without an entry here nothing ever bumps it and its alerts (urllib3,
  # requests, pytest) only ever got a one-shot security PR.
  - package-ecosystem: "uv"
    directory: "/clients/python"
    schedule:
      interval: "weekly"
    groups:
      uv-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Nightly regression harness — own uv project, own lockfile.
  - package-ecosystem: "uv"
    directory: "/tests/regressions"
    schedule:
      interval: "weekly"
    groups:
      uv-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # The pyo3 extension. pyo3 and arrow's `pyarrow` feature both link the native
  # `python` library, so cargo only resolves when the two move together — a
  # single-crate security bump of pyo3 always fails to resolve. Group them so
  # Dependabot proposes the pair.
  - package-ecosystem: "cargo"
    directory: "/rust/gs_clustering"
    schedule:
      interval: "weekly"
    groups:
      pyo3-arrow:
        patterns:
          - "pyo3"
          - "arrow"

  # Base and tool images pinned in the Dockerfile (python, uv, temurin).
  # They are pinned on purpose — a moving tag silently re-ships the big
  # runtime layers to prod — so something has to bump them; this is it.
  # Only FROM lines are parsed, which is why the uv/temurin pins live in
  # named stages rather than inline COPY --from refs.
  # One grouped PR per week keeps the noise down; CI builds the image on
  # the PR, so a bad bump is visible before merge.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker-images:
        patterns:
          - "*"
    # Two of the three pinned images must not move on their own:
    #   * python — the project is `requires-python = ">=3.10, <3.14"`, the
    #     runtime stage prunes a hardcoded /usr/local/lib/python3.13 path, and
    #     psycopg2-binary/pyspark have no wheels beyond 3.13. A 3.14 bump fails
    #     the image build (PR #127); raise it deliberately together with
    #     pyproject and the Dockerfile paths.
    #   * eclipse-temurin — the `java11` stage exists *because* prod Spark
    #     executors run Java 11 (shared hosts capped there by Cassandra 4.x);
    #     a Java-17+ driver breaks Kryo task-result deserialization. Only the
    #     digest may move, never the major.
    ignore:
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "eclipse-temurin"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  # `directory: "/"` above covers the two root Dockerfiles but not
  # subdirectories, so the Spark image had no coverage at all. Its base is
  # `eclipse-temurin:11-jdk` — same Java 11 constraint as the runtime image's
  # `java11` stage (prod Spark executors are capped at 11 by Cassandra 4.x,
  # and a Java-17+ driver breaks Kryo task-result deserialization), so major
  # and minor are ignored here too and only the tag's digest may move.
  - package-ecosystem: "docker"
    directory: "/spark"
    schedule:
      interval: "weekly"
    groups:
      docker-images:
        patterns:
          - "*"
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  # Workflow actions are pinned to commit SHAs (supply-chain hardening);
  # without this they would silently rot at whatever SHA they were pinned to.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
