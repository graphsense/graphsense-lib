# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "uv" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"

  # Base and tool images pinned in the Dockerfile (python, uv, temurin).
  # They are pinned on purpose — a moving tag silently re-ships the big
  # runtime layers to prod — so something has to bump them; this is it.
  # Only FROM lines are parsed, which is why the uv/temurin pins live in
  # named stages rather than inline COPY --from refs.
  # One grouped PR per week keeps the noise down; CI builds the image on
  # the PR, so a bad bump is visible before merge.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker-images:
        patterns:
          - "*"
    # Two of the three pinned images must not move on their own:
    #   * python — the project is `requires-python = ">=3.10, <3.14"`, the
    #     runtime stage prunes a hardcoded /usr/local/lib/python3.13 path, and
    #     psycopg2-binary/pyspark have no wheels beyond 3.13. A 3.14 bump fails
    #     the image build (PR #127); raise it deliberately together with
    #     pyproject and the Dockerfile paths.
    #   * eclipse-temurin — the `java11` stage exists *because* prod Spark
    #     executors run Java 11 (shared hosts capped there by Cassandra 4.x);
    #     a Java-17+ driver breaks Kryo task-result deserialization. Only the
    #     digest may move, never the major.
    ignore:
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "eclipse-temurin"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  # Workflow actions are pinned to commit SHAs (supply-chain hardening);
  # without this they would silently rot at whatever SHA they were pinned to.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
