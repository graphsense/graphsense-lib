# gitleaks configuration: the default rules, minus public on-chain data.
# Used by the pre-commit hook (staged diff) and the CI job (whole history).
# Both print file, line and rule only, never a value (--redact).
[extend]
useDefault = true

# Test fixtures full of public chain data: tx hashes, addresses and token
# configurations, hex or base64, which the generic-api-key rule takes for keys.
# src/test/resources is the same tree before it moved into spark/.
[[allowlists]]
description = "on-chain test fixtures"
paths = [
  '''^(spark/)?src/test/resources/''',
  '''^tests/web/cassandra/data/''',
  '''^tests/convert/graph_convert/golden/''',
]

# A 0x-prefixed 20-byte address or 32-byte hash is public chain data, never a
# credential; no API key format starts with 0x.
[[allowlists]]
description = "EVM addresses and hashes"
regexTarget = "secret"
regexes = ['''^0x[0-9a-fA-F]{40}$''', '''^0x[0-9a-fA-F]{64}$''']
